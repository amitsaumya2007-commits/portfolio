<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A friendly spider crawler walking over a bookshelf, a price tag reading 51.77 pounds, a book_prices.jsonl output card and pagination 1 2 3 next">
  <title>Book Price Scraper</title>
  <style>
    .walk{animation:walk 8s ease-in-out infinite alternate}
    @keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(220px)}}
    .hop{animation:hop .5s ease-in-out infinite alternate}
    @keyframes hop{from{transform:translateY(0)}to{transform:translateY(-4px)}}
    .legs{animation:legs .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
    @keyframes legs{from{transform:skewX(-8deg)}to{transform:skewX(8deg)}}
    .look{animation:look 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes look{0%,40%{transform:translateX(-2px)}50%,90%{transform:translateX(2px)}100%{transform:translateX(-2px)}}
    .tag{animation:swing 3s ease-in-out infinite;transform-origin:452px 200px}
    @keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(2deg)}}
    .ln{animation:ln1 6s ease-in-out infinite}
    .ln.l2{animation-name:ln2}.ln.l3{animation-name:ln3}
    @keyframes ln1{0%,70%{opacity:1;transform:translateX(0)}76%,80%{opacity:0;transform:translateX(-8px)}86%,100%{opacity:1;transform:translateX(0)}}
    @keyframes ln2{0%,70%{opacity:1;transform:translateX(0)}76%,86%{opacity:0;transform:translateX(-8px)}92%,100%{opacity:1;transform:translateX(0)}}
    @keyframes ln3{0%,70%{opacity:1;transform:translateX(0)}76%,92%{opacity:0;transform:translateX(-8px)}98%,100%{opacity:1;transform:translateX(0)}}
    .pg{opacity:0;animation:pg 4.5s steps(1) infinite}
    .pg.p2{animation-delay:1.5s}.pg.p3{animation-delay:3s}
    @keyframes pg{0%{opacity:1}33.33%,100%{opacity:0}}
    .nx{animation:nx 1.5s ease-in-out infinite}
    @keyframes nx{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}.pg.p1{opacity:1}}
  </style>

  <rect width="800" height="600" fill="#E9B98B"/>

  <!-- BOOKSHELF -->
