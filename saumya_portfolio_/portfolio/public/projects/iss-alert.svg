<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cute ISS orbiting over Earth, a dashed plus-minus 5 degree window over a location pin, and a WhatsApp alert bubble">
  <title>ISS Proximity Alert</title>
  <style>
    .tw{animation:tw 3s ease-in-out infinite}
    .tw.d1{animation-delay:-1s}.tw.d2{animation-delay:-2s}.tw.d3{animation-delay:-.5s}.tw.d4{animation-delay:-1.6s}
    @keyframes tw{0%,100%{opacity:1}50%{opacity:.2}}
    .orbit{animation:orb 4s linear infinite}
    @keyframes orb{to{stroke-dashoffset:-72}}
    .iss{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes float{0%,100%{transform:translateY(-6px) rotate(-2deg)}50%{transform:translateY(6px) rotate(2deg)}}
    .ring{animation:ring 3s ease-out infinite;transform-box:fill-box;transform-origin:center;opacity:0}
    .ring.r2{animation-delay:-1.5s}
    @keyframes ring{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.5);opacity:0}}
    .win{animation:dash 6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-60}}
    .bubble{animation:pop 7s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
    @keyframes pop{0%,62%{transform:scale(1);opacity:1}70%{transform:scale(.9);opacity:0}71%,78%{transform:scale(.2);opacity:0}88%{transform:scale(1.06);opacity:1}94%,100%{transform:scale(1);opacity:1}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}.ring{opacity:.6}.bubble{opacity:1}}
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121633"/>
      <stop offset="1" stop-color="#1C2352"/>
    </linearGradient>
    <clipPath id="earthClip"><circle cx="400" cy="1130" r="680"/></clipPath>
    <g id="panel">
      <rect x="0" y="0" width="44" height="72" rx="5" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
      <path d="M22 2V70M2 18H42M2 36H42M2 54H42" stroke="#141414" stroke-width="2" fill="none"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#F4F1E6">
    <circle class="tw" cx="70" cy="190" r="2.5"/>
    <circle class="tw d1" cx="150" cy="70" r="2"/>
    <circle class="tw d2" cx="300" cy="50" r="2.5"/>
    <circle class="tw d3" cx="520" cy="62" r="2"/>
    <circle class="tw d4" cx="610" cy="180" r="2.5"/>
    <circle class="tw d1" cx="750" cy="220" r="2"/>
    <circle class="tw d2" cx="230" cy="250" r="2"/>
    <circle class="tw d3" cx="660" cy="290" r="2"/>
    <circle class="tw d4" cx="120" cy="300" r="2"/>
    <circle class="tw" cx="560" cy="140" r="1.8"/>
    <circle class="tw d2" cx="40" cy="110" r="1.8"/>
    <circle class="tw d3" cx="760" cy="150" r="1.8"/>
    <path class="tw d1" d="M215 128l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z" fill="#D5E64B"/>
    <path class="tw d3" d="M600 240l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z"/>
    <path class="tw d4" d="M480 40l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" fill="#A68BF7"/>
  </g>

  <!-- orbit path -->
  <path class="orbit" d="M-20 340Q400 60 820 340" fill="none" stroke="#F4F1E6" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- earth -->
  <circle cx="400" cy="1130" r="704" fill="#A68BF7" opacity=".22"/>
  <circle cx="400" cy="1130" r="692" fill="#A68BF7" opacity=".3"/>
  <circle cx="400" cy="1130" r="680" fill="#A68BF7"/>
  <g clip-path="url(#earthClip)">
    <path d="M-10 540C60 500 150 488 230 500C300 512 300 548 250 566C190 588 80 600-10 600Z" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <path d="M560 476C620 458 700 470 760 500C800 520 820 540 820 600L640 600C600 570 520 560 515 525C512 500 530 484 560 476Z" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <path d="M330 560C360 545 420 548 450 565C470 580 450 600 420 600L340 600C315 592 310 572 330 560Z" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <path d="M60 580Q400 470 740 580" fill="none" stroke="#8B6FEA" stroke-width="3" stroke-dasharray="3 12" stroke-linecap="round"/>
  </g>
  <circle cx="400" cy="1130" r="680" fill="none" stroke="#141414" stroke-width="4"/>

  <!-- radar rings at the pin -->
  <ellipse class="ring" cx="400" cy="470" rx="90" ry="26" fill="none" stroke="#D5E64B" stroke-width="4"/>
  <ellipse class="ring r2" cx="400" cy="470" rx="90" ry="26" fill="none" stroke="#D5E64B" stroke-width="4"/>

  <!-- detection window -->
  <rect class="win" x="335" y="360" width="130" height="130" rx="10" fill="#D5E64B" fill-opacity=".08" stroke="#D5E64B" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round"/>
  <path d="M335 384V360H359M441 360H465V384M465 466V490H441M359 490H335V466" fill="none" stroke="#F4F1E6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="279" y="332" width="76" height="38" rx="12" fill="#141414" transform="translate(5 5)"/>
    <rect x="279" y="332" width="76" height="38" rx="12" fill="#D5E64B" stroke="#141414" stroke-width="4"/>
    <text x="317" y="359" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#141414">±5°</text>
  </g>

  <!-- location pin -->
  <path d="M408 478C393 456 380 444 380 428A28 28 0 1 1 436 428C436 444 423 456 408 478Z" fill="#141414"/>
  <path d="M400 470C385 448 372 436 372 420A28 28 0 1 1 428 420C428 436 415 448 400 470Z" fill="#FFFFFF" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="400" cy="419" r="10" fill="#141414"/>

  <!-- ISS -->
  <g transform="translate(400 200)">
    <g class="iss">
      <!-- hard shadow -->
      <g fill="#141414" transform="translate(8 8)">
        <rect x="-150" y="-86" width="44" height="72" rx="5"/><rect x="-100" y="-86" width="44" height="72" rx="5"/>
        <rect x="56" y="-86" width="44" height="72" rx="5"/><rect x="106" y="-86" width="44" height="72" rx="5"/>
        <rect x="-150" y="14" width="44" height="72" rx="5"/><rect x="-100" y="14" width="44" height="72" rx="5"/>
        <rect x="56" y="14" width="44" height="72" rx="5"/><rect x="106" y="14" width="44" height="72" rx="5"/>
        <rect x="-16" y="-60" width="32" height="120" rx="12"/>
        <rect x="-44" y="-30" width="88" height="60" rx="18"/>
      </g>
      <!-- truss -->
      <rect x="-156" y="-7" width="312" height="14" rx="7" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
      <path d="M-140 -7L-128 7M-116 -7L-104 7M-92 -7L-80 7M-68 -7L-56 7M56 -7L68 7M80 -7L92 7M104 -7L116 7M128 -7L140 7" stroke="#141414" stroke-width="2"/>
      <!-- solar wings -->
      <use href="#panel" x="-150" y="-86"/><use href="#panel" x="-100" y="-86"/>
      <use href="#panel" x="56" y="-86"/><use href="#panel" x="106" y="-86"/>
      <use href="#panel" x="-150" y="14"/><use href="#panel" x="-100" y="14"/>
      <use href="#panel" x="56" y="14"/><use href="#panel" x="106" y="14"/>
      <!-- modules -->
      <rect x="-16" y="-60" width="32" height="120" rx="12" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
      <path d="M-16 -40H16M-16 40H16" stroke="#141414" stroke-width="3"/>
      <rect x="-44" y="-30" width="88" height="60" rx="18" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
      <circle cx="-15" cy="-4" r="5" fill="#141414"/>
      <circle cx="15" cy="-4" r="5" fill="#141414"/>
      <circle cx="-13.5" cy="-5.5" r="1.6" fill="#FFFFFF"/>
      <circle cx="16.5" cy="-5.5" r="1.6" fill="#FFFFFF"/>
      <path d="M-8 9Q0 16 8 9" fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-28" cy="8" rx="6" ry="3.5" fill="#A68BF7"/>
      <ellipse cx="28" cy="8" rx="6" ry="3.5" fill="#A68BF7"/>
      <path d="M0 -60V-74" stroke="#141414" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="-78" r="6" fill="#D5E64B" stroke="#141414" stroke-width="3"/>
    </g>
  </g>

  <!-- WhatsApp alert bubble -->
  <g class="bubble">
    <path d="M505 314H728A16 16 0 0 1 744 330V378A16 16 0 0 1 728 394H520L498 410L505 390A16 16 0 0 1 489 374V330A16 16 0 0 1 505 314Z" fill="#141414" transform="translate(8 8)"/>
    <path d="M505 314H728A16 16 0 0 1 744 330V378A16 16 0 0 1 728 394H520L498 410L505 390A16 16 0 0 1 489 374V330A16 16 0 0 1 505 314Z" fill="#25D366" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <text x="509" y="351" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF">ISS overhead!</text>
    <text x="509" y="378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#0E3B22">via Twilio · 1/pass</text>
    <path d="M692 372l5 5 9-10M702 372l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- poll label -->
  <g>
    <rect x="56" y="52" width="150" height="42" rx="21" fill="#141414" transform="translate(6 6)"/>
    <rect x="56" y="52" width="150" height="42" rx="21" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
    <circle cx="80" cy="73" r="6" fill="#25D366" stroke="#141414" stroke-width="2.5"/>
    <text x="96" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#141414">poll: 10s</text>
  </g>

  <!-- decorations -->
  <g transform="translate(704 92)"><g class="spin">
    <ellipse rx="9" ry="27" fill="#A68BF7"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(96 410)"><g class="bob">
    <g fill="#D5E64B" stroke="#141414" stroke-width="3">
      <circle cx="0" cy="-13" r="10"/><circle cx="12.4" cy="-4" r="10"/><circle cx="7.6" cy="10.5" r="10"/><circle cx="-7.6" cy="10.5" r="10"/><circle cx="-12.4" cy="-4" r="10"/>
    </g>
    <circle r="7" fill="#141414"/>
  </g></g>
  <g transform="translate(190 330)"><g class="spin">
    <ellipse rx="5" ry="15" fill="#A68BF7"/><ellipse rx="5" ry="15" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="5" ry="15" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
</svg>
