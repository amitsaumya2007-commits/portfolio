<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="An audio file card with a bouncing waveform, an arrow through Deepgram nova-3, and a JSON transcript card">
  <title>Audio to Transcript</title>
  <style>
    .bar{animation:eq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .b1{animation-delay:-.1s}.b2{animation-delay:-.45s}.b3{animation-delay:-.8s}.b4{animation-delay:-.3s}.b5{animation-delay:-.65s}.b6{animation-delay:-.95s}.b7{animation-delay:-.2s}.b8{animation-delay:-.55s}.b9{animation-delay:-.75s}.b10{animation-delay:-.4s}
    @keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(-5px)}50%{transform:translateX(6px)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .knob{animation:play 6s ease-in-out infinite}
    @keyframes play{0%{transform:translateX(0)}100%{transform:translateX(150px)}}
    .fill{animation:grow 6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
    @keyframes grow{0%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>

  <rect width="800" height="600" fill="#52C9A8"/>
  <!-- soft backdrop blobs -->
  <circle cx="190" cy="300" r="190" fill="#FFFFFF" opacity=".12"/>
  <circle cx="605" cy="300" r="200" fill="#FFFFFF" opacity=".12"/>

  <!-- AUDIO CARD -->
  <rect x="68" y="158" width="260" height="300" rx="26" fill="#141414"/>
  <rect x="60" y="150" width="260" height="300" rx="26" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
  <circle cx="106" cy="196" r="24" fill="#D5E64B" stroke="#141414" stroke-width="4"/>
  <path d="M99 184L117 196L99 208Z" fill="#141414" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  <text x="142" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#141414">audio.mp3</text>
  <text x="142" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5A5A5A">2.4 MB</text>
  <rect x="84" y="236" width="212" height="128" rx="16" fill="#E4DBFD" stroke="#141414" stroke-width="3"/>
  <g fill="#141414">
    <rect class="bar b1" x="95" y="285" width="10" height="30" rx="5"/>
    <rect class="bar b2" x="113" y="272" width="10" height="56" rx="5"/>
    <rect class="bar b3" x="131" y="260" width="10" height="80" rx="5"/>
    <rect class="bar b4" x="149" y="276" width="10" height="48" rx="5"/>
    <rect class="bar b5" x="167" y="252" width="10" height="96" rx="5" fill="#7B5CF0"/>
    <rect class="bar b6" x="185" y="268" width="10" height="64" rx="5" fill="#7B5CF0"/>
    <rect class="bar b7" x="203" y="256" width="10" height="88" rx="5" fill="#7B5CF0"/>
    <rect class="bar b8" x="221" y="280" width="10" height="40" rx="5"/>
    <rect class="bar b9" x="239" y="265" width="10" height="70" rx="5"/>
    <rect class="bar b10" x="257" y="275" width="10" height="50" rx="5"/>
    <rect class="bar b3" x="275" y="287" width="10" height="26" rx="5"/>
  </g>
  <rect x="84" y="390" width="212" height="10" rx="5" fill="#F4F1E6" stroke="#141414" stroke-width="3"/>
  <rect class="fill" x="86" y="392" width="166" height="6" rx="3" fill="#A68BF7"/>
  <g class="knob"><circle cx="100" cy="395" r="10" fill="#D5E64B" stroke="#141414" stroke-width="3"/></g>
  <text x="84" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#141414">0:42</text>
  <text x="296" y="430" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#141414">1:30</text>

  <!-- ARROW -->
  <g>
    <rect x="344" y="226" width="102" height="34" rx="17" fill="#141414" transform="translate(5 5)"/>
    <rect x="344" y="226" width="102" height="34" rx="17" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
    <text x="395" y="249" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#141414">nova-3</text>
  </g>
  <g class="nudge">
    <path d="M352 290H414V268L456 304L414 340V318H352Z" fill="#141414" transform="translate(7 7)" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <path d="M352 290H414V268L456 304L414 340V318H352Z" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- JSON CARD -->
  <rect x="478" y="148" width="272" height="314" rx="22" fill="#141414"/>
  <rect x="470" y="140" width="272" height="314" rx="22" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
  <path d="M472 186V162A20 20 0 0 1 492 142H720A20 20 0 0 1 740 162V186Z" fill="#141414"/>
  <circle cx="494" cy="164" r="6" fill="#D5E64B"/>
  <text x="510" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#F4F1E6">transcript.json</text>
  <rect x="600" y="243" width="90" height="26" rx="7" fill="#D5E64B"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#141414">
    <text x="492" y="226">{</text>
    <text x="512" y="262"><tspan fill="#6A4BE0">"model"</tspan>: "nova-3",</text>
    <text x="512" y="298"><tspan fill="#6A4BE0">"transcript"</tspan>:</text>
    <text x="533" y="332">"hello world..."</text>
    <text x="512" y="368"><tspan fill="#6A4BE0">"confidence"</tspan>: 0.98</text>
    <text x="492" y="404">}</text>
  </g>
  <rect class="caret" x="703" y="318" width="10" height="19" fill="#141414"/>
  <rect x="492" y="420" width="96" height="10" rx="5" fill="#A68BF7"/>
  <rect x="596" y="420" width="54" height="10" rx="5" fill="#D9D3BF"/>

  <!-- decorations -->
  <g transform="translate(402 128)"><g class="spin">
    <ellipse rx="9" ry="27" fill="#A68BF7"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(404 476)"><g class="bob">
    <g fill="#D5E64B" stroke="#141414" stroke-width="3">
      <circle cx="0" cy="-13" r="10"/><circle cx="12.4" cy="-4" r="10"/><circle cx="7.6" cy="10.5" r="10"/><circle cx="-7.6" cy="10.5" r="10"/><circle cx="-12.4" cy="-4" r="10"/>
    </g>
    <circle r="7" fill="#141414"/>
  </g></g>
  <g transform="translate(92 112)"><g class="spin">
    <ellipse rx="5" ry="15" fill="#A68BF7"/><ellipse rx="5" ry="15" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="5" ry="15" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(712 500)"><g class="spin">
    <ellipse rx="6" ry="18" fill="#F4F1E6"/><ellipse rx="6" ry="18" fill="#F4F1E6" transform="rotate(60)"/><ellipse rx="6" ry="18" fill="#F4F1E6" transform="rotate(120)"/>
  </g></g>
</svg>
