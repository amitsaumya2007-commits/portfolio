<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Terminal window with a text chess board using piece codes like bK and wP, and the command move e2 e4 sliding a white pawn forward">
  <title>Terminal Chess</title>
  <style>
    .mv{animation:mv 5s ease-in-out infinite}
    @keyframes mv{0%,30%{transform:translateY(0);opacity:1}48%,84%{transform:translateY(-80px);opacity:1}92%{transform:translateY(-80px);opacity:0}93%{transform:translateY(0);opacity:0}100%{transform:translateY(0);opacity:1}}
    .hl{animation:hl 5s ease-in-out infinite}
    @keyframes hl{0%,30%{opacity:.25}48%,84%{opacity:1}100%{opacity:.25}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .tilt{animation:tilt 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>

  <rect width="800" height="600" fill="#D8B6D3"/>

  <!-- terminal window -->
  <rect x="170" y="66" width="480" height="488" rx="22" fill="#141414"/>
  <rect x="160" y="56" width="480" height="488" rx="22" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
  <path d="M162 100V76A18 18 0 0 1 180 58H620A18 18 0 0 1 638 76V100Z" fill="#141414"/>
  <circle cx="190" cy="79" r="7" fill="#A68BF7"/><circle cx="214" cy="79" r="7" fill="#D5E64B"/><circle cx="238" cy="79" r="7" fill="#F4F1E6"/>
  <text x="400" y="85" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#F4F1E6">python main.py</text>

  <!-- board -->
  <rect x="240" y="124" width="320" height="320" fill="#F4F1E6"/>
  <g fill="#C9B8FB"><rect x="240" y="404" width="40" height="40"/><rect x="320" y="404" width="40" height="40"/><rect x="400" y="404" width="40" height="40"/><rect x="480" y="404" width="40" height="40"/><rect x="280" y="364" width="40" height="40"/><rect x="360" y="364" width="40" height="40"/><rect x="440" y="364" width="40" height="40"/><rect x="520" y="364" width="40" height="40"/><rect x="240" y="324" width="40" height="40"/><rect x="320" y="324" width="40" height="40"/><rect x="400" y="324" width="40" height="40"/><rect x="480" y="324" width="40" height="40"/><rect x="280" y="284" width="40" height="40"/><rect x="360" y="284" width="40" height="40"/><rect x="440" y="284" width="40" height="40"/><rect x="520" y="284" width="40" height="40"/><rect x="240" y="244" width="40" height="40"/><rect x="320" y="244" width="40" height="40"/><rect x="400" y="244" width="40" height="40"/><rect x="480" y="244" width="40" height="40"/><rect x="280" y="204" width="40" height="40"/><rect x="360" y="204" width="40" height="40"/><rect x="440" y="204" width="40" height="40"/><rect x="520" y="204" width="40" height="40"/><rect x="240" y="164" width="40" height="40"/><rect x="320" y="164" width="40" height="40"/><rect x="400" y="164" width="40" height="40"/><rect x="480" y="164" width="40" height="40"/><rect x="280" y="124" width="40" height="40"/><rect x="360" y="124" width="40" height="40"/><rect x="440" y="124" width="40" height="40"/><rect x="520" y="124" width="40" height="40"/></g>
  <rect class="hl" x="402" y="366" width="36" height="36" rx="4" fill="none" stroke="#D5E64B" stroke-width="4"/>
  <rect class="hl" x="402" y="286" width="36" height="36" rx="4" fill="#D5E64B" fill-opacity=".45" stroke="#141414" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="240" y="124" width="320" height="320" fill="none" stroke="#141414" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" text-anchor="middle">
      <text x="260" y="150" fill="#141414">bR</text>
      <text x="260" y="190" fill="#141414">bP</text>
      <text x="260" y="390" fill="#141414">wP</text>
      <text x="260" y="430" fill="#141414">wR</text>
      <text x="300" y="150" fill="#141414">bN</text>
      <text x="300" y="190" fill="#141414">bP</text>
      <text x="300" y="390" fill="#141414">wP</text>
      <text x="300" y="430" fill="#141414">wN</text>
      <text x="340" y="150" fill="#141414">bB</text>
      <text x="340" y="190" fill="#141414">bP</text>
      <text x="340" y="390" fill="#141414">wP</text>
      <text x="340" y="430" fill="#141414">wB</text>
      <text x="380" y="150" fill="#141414">bQ</text>
      <text x="380" y="190" fill="#141414">bP</text>
      <text x="380" y="390" fill="#141414">wP</text>
      <text x="380" y="430" fill="#141414">wQ</text>
      <text x="420" y="150" fill="#141414">bK</text>
      <text x="420" y="190" fill="#141414">bP</text>
      <text x="420" y="430" fill="#141414">wK</text>
      <text x="460" y="150" fill="#141414">bB</text>
      <text x="460" y="190" fill="#141414">bP</text>
      <text x="460" y="390" fill="#141414">wP</text>
      <text x="460" y="430" fill="#141414">wB</text>
      <text x="500" y="150" fill="#141414">bN</text>
      <text x="500" y="190" fill="#141414">bP</text>
      <text x="500" y="390" fill="#141414">wP</text>
      <text x="500" y="430" fill="#141414">wN</text>
      <text x="540" y="150" fill="#141414">bR</text>
      <text x="540" y="190" fill="#141414">bP</text>
      <text x="540" y="390" fill="#141414">wP</text>
      <text x="540" y="430" fill="#141414">wR</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#7A6C80" text-anchor="middle"><text x="226" y="430">1</text><text x="226" y="390">2</text><text x="226" y="350">3</text><text x="226" y="310">4</text><text x="226" y="270">5</text><text x="226" y="230">6</text><text x="226" y="190">7</text><text x="226" y="150">8</text><text x="260" y="468">a</text><text x="300" y="468">b</text><text x="340" y="468">c</text><text x="380" y="468">d</text><text x="420" y="468">e</text><text x="460" y="468">f</text><text x="500" y="468">g</text><text x="540" y="468">h</text></g>

  <!-- moving pawn e2 -> e4 -->
  <g class="mv">
    <rect x="404" y="368" width="32" height="32" rx="7" fill="#D5E64B" stroke="#141414" stroke-width="3"/>
    <text x="420" y="390" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#141414">wP</text>
  </g>

  <!-- prompt -->
  <text x="196" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#141414"><tspan fill="#5B3FD0">&gt;</tspan> move e2 e4</text>
  <rect class="caret" x="348" y="497" width="11" height="21" fill="#141414"/>

  <!-- reset sticker -->
  <g transform="translate(694 196) rotate(9)">
    <rect x="-50" y="-22" width="100" height="44" rx="22" fill="#141414" transform="translate(5 5)"/>
    <rect x="-50" y="-22" width="100" height="44" rx="22" fill="#D5E64B" stroke="#141414" stroke-width="4"/>
    <text x="0" y="7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#141414">reset</text>
  </g>

  <!-- pawn sticker -->
  <g transform="translate(96 388)"><g class="tilt">
    <g fill="#141414" transform="translate(6 6)">
      <rect x="-36" y="32" width="72" height="18" rx="7"/>
      <path d="M-24 34C-20 10-12-6-10-14H10C12-6 20 10 24 34Z"/>
      <rect x="-21" y="-22" width="42" height="12" rx="6"/>
      <circle cx="0" cy="-40" r="18"/>
    </g>
    <g fill="#A68BF7" stroke="#141414" stroke-width="4" stroke-linejoin="round">
      <path d="M-24 34C-20 10-12-6-10-14H10C12-6 20 10 24 34Z"/>
      <rect x="-36" y="32" width="72" height="18" rx="7"/>
      <rect x="-21" y="-22" width="42" height="12" rx="6"/>
      <circle cx="0" cy="-40" r="18"/>
    </g>
    <circle cx="-6" cy="-45" r="5" fill="#FFFFFF" opacity=".8"/>
  </g></g>

  <!-- decorations -->
  <g transform="translate(96 140)"><g class="spin">
    <ellipse rx="9" ry="27" fill="#A68BF7"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(706 452)"><g class="bob">
    <g fill="#D5E64B" stroke="#141414" stroke-width="3">
      <circle cx="0" cy="-13" r="10"/><circle cx="12.4" cy="-4" r="10"/><circle cx="7.6" cy="10.5" r="10"/><circle cx="-7.6" cy="10.5" r="10"/><circle cx="-12.4" cy="-4" r="10"/>
    </g>
    <circle r="7" fill="#141414"/>
  </g></g>
  <g transform="translate(712 318)"><g class="spin">
    <ellipse rx="5" ry="15" fill="#FFFFFF"/><ellipse rx="5" ry="15" fill="#FFFFFF" transform="rotate(60)"/><ellipse rx="5" ry="15" fill="#FFFFFF" transform="rotate(120)"/>
  </g></g>
</svg>
