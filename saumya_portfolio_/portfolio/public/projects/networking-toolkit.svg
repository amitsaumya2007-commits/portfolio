<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Node graph: a laptop client sending packets to a server with a 200 OK response in 142ms, and a DNS node resolving example.com to an IP">
  <title>Networking Toolkit</title>
  <style>
    .flow{animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .flowr{animation:flowr 1.2s linear infinite}
    @keyframes flowr{to{stroke-dashoffset:24}}
    .req{animation:req 2.4s linear infinite;opacity:0}
    @keyframes req{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(236px);opacity:0}}
    .res{animation:res 2.4s linear infinite;opacity:0}
    @keyframes res{0%{transform:translateX(0);opacity:0}10%,85%{opacity:1}100%{transform:translateX(-236px);opacity:0}}
    .dq{animation:dq 2.4s linear infinite;opacity:0}
    @keyframes dq{0%{transform:translate(0,0);opacity:0}12%,80%{opacity:1}100%{transform:translate(104px,-92px);opacity:0}}
    .k1{animation-delay:-.8s}.k2{animation-delay:-1.6s}
    .led{animation:led 1.4s steps(1) infinite}
    .led.e2{animation-delay:-.5s}.led.e3{animation-delay:-1s}
    @keyframes led{50%{opacity:.25}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pop{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.1)}}
    .pulse{animation:pulse 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.45);opacity:0}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}.req,.res,.dq{opacity:1}.pulse{opacity:0}}
  </style>

  <rect width="800" height="600" fill="#5470D6"/>
  <g fill="#FFFFFF" opacity=".14">
    <circle cx="120" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/><circle cx="200" cy="80" r="2.5"/>
    <circle cx="120" cy="120" r="2.5"/><circle cx="160" cy="120" r="2.5"/><circle cx="200" cy="120" r="2.5"/>
    <circle cx="600" cy="480" r="2.5"/><circle cx="640" cy="480" r="2.5"/><circle cx="680" cy="480" r="2.5"/>
    <circle cx="600" cy="520" r="2.5"/><circle cx="640" cy="520" r="2.5"/><circle cx="680" cy="520" r="2.5"/>
  </g>

  <!-- links -->
  <path class="flow" d="M236 294L356 188" stroke="#F4F1E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" fill="none"/>
  <path class="flow" d="M282 340H550" stroke="#F4F1E6" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" fill="none"/>
  <path class="flowr" d="M282 378H550" stroke="#D5E64B" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 14" fill="none"/>

  <!-- packets -->
  <g stroke="#141414" stroke-width="3" stroke-linejoin="round">
    <rect class="req" x="290" y="332" width="16" height="16" rx="3" fill="#A68BF7"/>
    <rect class="req k1" x="290" y="332" width="16" height="16" rx="3" fill="#A68BF7"/>
    <rect class="req k2" x="290" y="332" width="16" height="16" rx="3" fill="#A68BF7"/>
    <rect class="res" x="526" y="370" width="16" height="16" rx="3" fill="#D5E64B"/>
    <rect class="res k1" x="526" y="370" width="16" height="16" rx="3" fill="#D5E64B"/>
    <rect class="res k2" x="526" y="370" width="16" height="16" rx="3" fill="#D5E64B"/>
    <rect class="dq" x="240" y="278" width="14" height="14" rx="3" fill="#FFFFFF"/>
    <rect class="dq k1" x="240" y="278" width="14" height="14" rx="3" fill="#FFFFFF"/>
    <rect class="dq k2" x="240" y="278" width="14" height="14" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- latency pill -->
  <g>
    <rect x="364" y="286" width="104" height="36" rx="18" fill="#141414" transform="translate(5 5)"/>
    <rect x="364" y="286" width="104" height="36" rx="18" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
    <circle cx="386" cy="305" r="9" fill="none" stroke="#141414" stroke-width="3"/>
    <path d="M386 299V305L390 308M383 293H389" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
    <text x="402" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#141414">142ms</text>
  </g>

  <!-- 200 OK -->
  <g class="pop">
    <rect x="352" y="398" width="126" height="44" rx="14" fill="#141414" transform="translate(6 6)"/>
    <rect x="352" y="398" width="126" height="44" rx="14" fill="#D5E64B" stroke="#141414" stroke-width="4"/>
    <text x="415" y="428" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#141414">200 OK</text>
  </g>

  <!-- laptop (client) -->
  <g>
    <rect x="98" y="292" width="170" height="122" rx="14" fill="#141414"/>
    <path d="M78 422H288L278 444H88Z" fill="#141414" transform="translate(8 8)" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <rect x="90" y="284" width="170" height="122" rx="14" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
    <rect x="102" y="296" width="146" height="98" rx="8" fill="#141414"/>
    <text x="114" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#D5E64B">$ GET /</text>
    <text x="114" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C9B8FB">content-type:</text>
    <text x="128" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#C9B8FB">text/html</text>
    <rect class="caret" x="114" y="376" width="9" height="12" fill="#F4F1E6"/>
    <path d="M78 422H288L278 444H88Z" fill="#FFFFFF" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <path d="M70 406H296V416A6 6 0 0 1 290 422H76A6 6 0 0 1 70 416Z" fill="#FFFFFF" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <rect x="160" y="406" width="46" height="7" rx="3.5" fill="#141414"/>
  </g>

  <!-- server -->
  <g>
    <rect x="568" y="268" width="140" height="186" rx="16" fill="#141414"/>
    <rect x="560" y="260" width="140" height="186" rx="16" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
    <g fill="#F4F1E6" stroke="#141414" stroke-width="4">
      <rect x="574" y="274" width="112" height="46" rx="8"/>
      <rect x="574" y="330" width="112" height="46" rx="8"/>
      <rect x="574" y="386" width="112" height="46" rx="8"/>
    </g>
    <g stroke="#141414" stroke-width="3" stroke-linecap="round">
      <path d="M632 290H670M632 304H660M632 346H670M632 360H660M632 402H670M632 416H660"/>
    </g>
    <g stroke="#141414" stroke-width="2.5">
      <circle class="led" cx="594" cy="297" r="7" fill="#D5E64B"/>
      <circle cx="613" cy="297" r="5" fill="#A68BF7"/>
      <circle class="led e2" cx="594" cy="353" r="7" fill="#D5E64B"/>
      <circle cx="613" cy="353" r="5" fill="#A68BF7"/>
      <circle class="led e3" cx="594" cy="409" r="7" fill="#D5E64B"/>
      <circle cx="613" cy="409" r="5" fill="#A68BF7"/>
    </g>
  </g>

  <!-- DNS node -->
  <circle class="pulse" cx="400" cy="150" r="54" fill="none" stroke="#D5E64B" stroke-width="4"/>
  <circle cx="408" cy="158" r="54" fill="#141414"/>
  <circle cx="400" cy="150" r="54" fill="#D5E64B" stroke="#141414" stroke-width="4"/>
  <ellipse cx="400" cy="150" rx="22" ry="54" fill="none" stroke="#141414" stroke-width="2.5" opacity=".35"/>
  <path d="M350 132H450M350 168H450" stroke="#141414" stroke-width="2.5" opacity=".35"/>
  <text x="400" y="160" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#141414">DNS</text>

  <!-- resolve card -->
  <g>
    <path d="M462 150H476" stroke="#F4F1E6" stroke-width="4" stroke-linecap="round"/>
    <rect x="482" y="128" width="240" height="46" rx="14" fill="#141414" transform="translate(6 6)"/>
    <rect x="482" y="128" width="240" height="46" rx="14" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
    <text x="500" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#141414">example.com <tspan fill="#6A4BE0">→</tspan> 93.184.x.x</text>
  </g>

  <!-- feature chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#141414" text-anchor="middle">
    <rect x="236" y="494" width="92" height="32" rx="16" fill="#F4F1E6" stroke="#141414" stroke-width="3"/>
    <text x="282" y="515">headers</text>
    <rect x="340" y="494" width="116" height="32" rx="16" fill="#C9B8FB" stroke="#141414" stroke-width="3"/>
    <text x="398" y="515">IPv4/IPv6</text>
    <rect x="468" y="494" width="100" height="32" rx="16" fill="#F4F1E6" stroke="#141414" stroke-width="3"/>
    <text x="518" y="515">scrapers</text>
  </g>

  <!-- decorations -->
  <g transform="translate(118 168)"><g class="spin">
    <ellipse rx="9" ry="27" fill="#A68BF7"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(724 520)"><g class="bob">
    <g fill="#D5E64B" stroke="#141414" stroke-width="3">
      <circle cx="0" cy="-13" r="10"/><circle cx="12.4" cy="-4" r="10"/><circle cx="7.6" cy="10.5" r="10"/><circle cx="-7.6" cy="10.5" r="10"/><circle cx="-12.4" cy="-4" r="10"/>
    </g>
    <circle r="7" fill="#141414"/>
  </g></g>
  <g transform="translate(736 236)"><g class="spin">
    <ellipse rx="5" ry="15" fill="#F4F1E6"/><ellipse rx="5" ry="15" fill="#F4F1E6" transform="rotate(60)"/><ellipse rx="5" ry="15" fill="#F4F1E6" transform="rotate(120)"/>
  </g></g>
</svg>
