<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Travel landing page in a browser: breadcrumb Home / Explore / Places, an embedded map with a dashed route, bouncing pins and a paper plane, plus a media card with mountains and sun">
  <title>Travel Discovery Page</title>
  <style>
    .route{animation:route 2s linear infinite}
    @keyframes route{to{stroke-dashoffset:-28}}
    .plane{offset-path:path('M150 452C210 452 240 342 300 332S392 290 418 242');offset-rotate:auto;animation:fly 6s linear -2.6s infinite}
    @keyframes fly{0%{offset-distance:0%;opacity:0}8%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
    .pin{animation:pin 2.4s ease-in-out infinite}
    .pin.p2{animation-delay:-.8s}.pin.p3{animation-delay:-1.6s}
    @keyframes pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .shd{animation:shd 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .shd.p2{animation-delay:-.8s}.shd.p3{animation-delay:-1.6s}
    @keyframes shd{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(.6);opacity:.2}}
    .sun{animation:sun 6s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes sun{to{transform:rotate(360deg)}}
    .cloud{animation:cloud 6s ease-in-out infinite}
    @keyframes cloud{0%,100%{transform:translateX(-6px)}50%{transform:translateX(8px)}}
    .spin{animation:spin 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(-4px) rotate(-8deg)}50%{transform:translateY(4px) rotate(8deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none !important}.plane{offset-distance:30%}}
  </style>
  <defs>
    <clipPath id="mapClip"><rect x="92" y="150" width="404" height="366" rx="14"/></clipPath>
    <clipPath id="photoClip"><rect x="530" y="162" width="166" height="116" rx="8"/></clipPath>
  </defs>

  <rect width="800" height="600" fill="#F08A7E"/>

  <!-- browser window -->
  <rect x="78" y="64" width="652" height="476" rx="22" fill="#141414"/>
  <rect x="70" y="56" width="652" height="476" rx="22" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
  <path d="M72 98V76A18 18 0 0 1 90 58H702A18 18 0 0 1 720 76V98Z" fill="#141414"/>
  <circle cx="98" cy="78" r="7" fill="#A68BF7"/><circle cx="120" cy="78" r="7" fill="#D5E64B"/><circle cx="142" cy="78" r="7" fill="#F4F1E6"/>
  <rect x="170" y="67" width="300" height="22" rx="11" fill="#FFFFFF" opacity=".18"/>

  <!-- breadcrumb -->
  <g font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="16">
    <text x="94" y="130"><tspan fill="#6A4BE0">Home</tspan><tspan fill="#9A9AA6"> / </tspan><tspan fill="#6A4BE0">Explore</tspan><tspan fill="#9A9AA6"> / </tspan><tspan fill="#141414">Places</tspan></text>
  </g>

  <!-- MAP -->
  <g clip-path="url(#mapClip)">
    <rect x="92" y="150" width="404" height="366" fill="#EEF3C2"/>
    <path d="M92 430C150 410 190 470 170 520L92 520Z" fill="#C9B8FB"/>
    <path d="M380 150C400 190 470 200 500 180V150Z" fill="#C9B8FB"/>
    <path d="M330 420C360 395 420 400 440 430C455 455 430 480 395 478C355 476 310 450 330 420Z" fill="#D5E64B"/>
    <path d="M150 190C175 172 225 178 232 205C238 230 200 245 170 238C140 230 128 205 150 190Z" fill="#D5E64B"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <path d="M92 300C200 290 300 380 500 360"/>
      <path d="M250 150C260 260 230 400 260 520"/>
      <path d="M92 220C160 230 220 210 260 205"/>
      <path d="M380 520C390 450 420 380 500 300"/>
    </g>
    <g fill="none" stroke="#141414" stroke-opacity=".12" stroke-width="2">
      <path d="M92 300C200 290 300 380 500 360"/>
      <path d="M250 150C260 260 230 400 260 520"/>
    </g>
  </g>
  <rect x="92" y="150" width="404" height="366" rx="14" fill="none" stroke="#141414" stroke-width="4"/>

  <!-- zoom control -->
  <rect x="456" y="164" width="28" height="56" rx="8" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
  <path d="M463 180H477M470 173V187M463 206H477M456 192H484" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round"/>

  <!-- route -->
  <path d="M150 452C210 452 240 342 300 332S392 290 418 242" fill="none" stroke="#141414" stroke-width="4"/>
  <path class="route" d="M150 452C210 452 240 342 300 332S392 290 418 242" fill="none" stroke="#F4F1E6" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 16"/>
  <path class="route" d="M150 452C210 452 240 342 300 332S392 290 418 242" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 16"/>

  <!-- pins -->
  <ellipse class="shd" cx="150" cy="454" rx="14" ry="5" fill="#141414"/>
  <ellipse class="shd p2" cx="300" cy="334" rx="14" ry="5" fill="#141414"/>
  <ellipse class="shd p3" cx="418" cy="244" rx="14" ry="5" fill="#141414"/>
  <g class="pin">
    <path d="M150 450C138 432 128 422 128 409A22 22 0 1 1 172 409C172 422 162 432 150 450Z" fill="#D5E64B" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="150" cy="408" r="8" fill="#141414"/>
  </g>
  <g class="pin p2">
    <path d="M300 330C288 312 278 302 278 289A22 22 0 1 1 322 289C322 302 312 312 300 330Z" fill="#FFFFFF" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="300" cy="288" r="8" fill="#141414"/>
  </g>
  <g class="pin p3">
    <path d="M418 240C406 222 396 212 396 199A22 22 0 1 1 440 199C440 212 430 222 418 240Z" fill="#A68BF7" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="418" cy="198" r="8" fill="#141414"/>
  </g>

  <!-- paper plane -->
  <g class="plane">
    <path d="M-18 -14L22 0L-18 14L-10 0Z" fill="#FFFFFF" stroke="#141414" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-10 0L22 0L-6 8Z" fill="#C9B8FB" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- media card -->
  <rect x="518" y="150" width="190" height="172" rx="14" fill="#F4F1E6" stroke="#141414" stroke-width="4"/>
  <g clip-path="url(#photoClip)">
    <rect x="530" y="162" width="166" height="116" fill="#C9B8FB"/>
    <g transform="translate(662 196)"><g class="sun">
      <circle r="16" fill="#D5E64B" stroke="#141414" stroke-width="3"/>
      <path d="M0 -25V-21M0 21V25M-25 0H-21M21 0H25M-18 -18L-15 -15M15 15L18 18M-18 18L-15 15M15 -15L18 -18" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    </g></g>
    <g class="cloud"><path d="M552 196A9 9 0 0 1 568 190A11 11 0 0 1 588 196H552Z" fill="#FFFFFF" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/></g>
    <path d="M524 284L580 214L612 250L640 222L702 284Z" fill="#141414"/>
    <path d="M524 284L580 214L612 250L640 222L702 284Z" fill="#7B5CF0" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
    <path d="M567 230L580 214L593 230L586 236L580 230L573 236Z" fill="#FFFFFF" stroke="#141414" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M524 284C560 262 620 262 702 284Z" fill="#D5E64B" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <rect x="530" y="162" width="166" height="116" rx="8" fill="none" stroke="#141414" stroke-width="3"/>
  <circle cx="545" cy="300" r="9" fill="#D5E64B" stroke="#141414" stroke-width="2.5"/>
  <path d="M542 295L550 300L542 305Z" fill="#141414"/>
  <rect x="562" y="294" width="100" height="10" rx="5" fill="#E2DCCB"/>

  <!-- places list -->
  <rect x="518" y="340" width="190" height="176" rx="14" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
  <text x="536" y="374" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="17" fill="#141414">Top spots</text>
  <g stroke="#141414" stroke-width="2.5" stroke-linejoin="round">
    <path d="M546 414C540 405 535 400 535 394A11 11 0 1 1 557 394C557 400 552 405 546 414Z" fill="#D5E64B"/>
    <path d="M546 450C540 441 535 436 535 430A11 11 0 1 1 557 430C557 436 552 441 546 450Z" fill="#FFFFFF"/>
    <path d="M546 486C540 477 535 472 535 466A11 11 0 1 1 557 466C557 472 552 477 546 486Z" fill="#A68BF7"/>
  </g>
  <g fill="#E2DCCB">
    <rect x="568" y="392" width="112" height="10" rx="5"/>
    <rect x="568" y="428" width="88" height="10" rx="5"/>
    <rect x="568" y="464" width="102" height="10" rx="5"/>
  </g>

  <!-- decorations -->
  <g transform="translate(724 66)"><g class="spin">
    <ellipse rx="9" ry="27" fill="#A68BF7"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(60)"/><ellipse rx="9" ry="27" fill="#A68BF7" transform="rotate(120)"/>
  </g></g>
  <g transform="translate(72 532)"><g class="bob">
    <g fill="#D5E64B" stroke="#141414" stroke-width="3">
      <circle cx="0" cy="-13" r="10"/><circle cx="12.4" cy="-4" r="10"/><circle cx="7.6" cy="10.5" r="10"/><circle cx="-7.6" cy="10.5" r="10"/><circle cx="-12.4" cy="-4" r="10"/>
    </g>
    <circle r="7" fill="#141414"/>
  </g></g>
  <g transform="translate(756 300)"><g class="spin">
    <ellipse rx="5" ry="15" fill="#F4F1E6"/><ellipse rx="5" ry="15" fill="#F4F1E6" transform="rotate(60)"/><ellipse rx="5" ry="15" fill="#F4F1E6" transform="rotate(120)"/>
  </g></g>
</svg>
